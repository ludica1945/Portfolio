<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="calculadora" aria-label="Calculadora básica">
    <section class="encabezado">
        <span class="etiqueta">CALCULADORA</span>
        <h1>Calculadora básica</h1>
    </section>

    <section class="panel-calculadora">
        <div class="pantalla" aria-live="polite">
            <div id="operacion"></div>
            <input type="text" id="resultado" placeholder="0" inputmode="decimal" aria-label="Resultado" readonly>
        </div>

        <div class="botones">
            <button type="button" class="accion" onclick="limpiar()" aria-label="Limpiar">AC</button>
            <button type="button" class="accion" onclick="borrarUltimo()" aria-label="Borrar último dígito">⌫</button>
            <button type="button" class="accion" onclick="porcentaje()" aria-label="Porcentaje">%</button>
            <button type="button" class="operador" onclick="seleccionarOperacion('/')" aria-label="Dividir">÷</button>

            <button type="button" class="numero" onclick="agregarNumero('7')">7</button>
            <button type="button" class="numero" onclick="agregarNumero('8')">8</button>
            <button type="button" class="numero" onclick="agregarNumero('9')">9</button>
            <button type="button" class="operador" onclick="seleccionarOperacion('*')" aria-label="Multiplicar">×</button>

            <button type="button" class="numero" onclick="agregarNumero('4')">4</button>
            <button type="button" class="numero" onclick="agregarNumero('5')">5</button>
            <button type="button" class="numero" onclick="agregarNumero('6')">6</button>
            <button type="button" class="operador" onclick="seleccionarOperacion('-')" aria-label="Restar">−</button>

            <button type="button" class="numero" onclick="agregarNumero('1')">1</button>
            <button type="button" class="numero" onclick="agregarNumero('2')">2</button>
            <button type="button" class="numero" onclick="agregarNumero('3')">3</button>
            <button type="button" class="operador" onclick="seleccionarOperacion('+')" aria-label="Sumar">+</button>

            <button type="button" class="numero" onclick="cambiarSigno()" aria-label="Cambiar signo">±</button>
            <button type="button" class="numero" onclick="agregarNumero('0')">0</button>
            <button type="button" class="numero" onclick="agregarNumero('.')" aria-label="Punto decimal">.</button>
            <button type="button" class="igual" onclick="calcular()" aria-label="Calcular">=</button>
        </div>

        <p class="ayuda">También podés usar el teclado</p>
    </section>
</main>

<script src="calculadora-s-m.js"></script>

</body>
</html>
